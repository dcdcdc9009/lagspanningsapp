<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beredning-Projektledning</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<nav class="topnav">
  <div class="nav-brand" data-view="projekt"><span class="nav-brand-dot"></span></div>
  <div class="nav-links">
    <a href="#projekt"        class="nav-link" data-view="projekt">Projekt</a>
    <a href="#konstruktioner" class="nav-link" data-view="konstruktioner">Byggprotokoll/materiallista</a>
    <a href="#artiklar"       class="nav-link" data-view="artiklar">Artiklar</a>
    <a href="#admin"          class="nav-link" data-view="admin">Admin</a>
    <a href="#anslutning"     class="nav-link" data-view="anslutning">Analys</a>
    <a href="#maskinplanering" class="nav-link" data-view="maskinplanering">Maskinplanering</a>
    <a href="#tidplan"        class="nav-link" data-view="tidplan">Tidplan</a>
    <a href="#kontrollrum"    class="nav-link" data-view="kontrollrum">Dashboard</a>
    <a href="#rapport"        class="nav-link" data-view="rapport">Rapporter</a>
    <a href="#statistik"      class="nav-link" data-view="statistik">Statistik</a>
  </div>
  <div class="nav-right" id="navRight">
    <span id="adminBadge" class="badge badge-admin hidden">Admin</span>
  </div>
</nav>

<div id="app" class="main-content"></div>

<!-- MODAL -->
<div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" id="modalClose" aria-label="Stäng">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div id="confirmDialog" class="modal-overlay hidden">
  <div class="modal-box modal-sm">
    <div class="modal-header">
      <h2 id="confirmTitle">Bekräfta</h2>
    </div>
    <div class="modal-body">
      <p id="confirmMsg"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="confirmOk">Ta bort</button>
      <button class="btn btn-secondary" id="confirmCancel">Avbryt</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
